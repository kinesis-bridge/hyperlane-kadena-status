<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Status Dashboard</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #2c3e50;
    }

    .card {
      background: white;
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      min-width: 320px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      text-align: center;
      color: #34495e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    td {
      padding: 10px 6px;
      border-bottom: 1px solid #ecf0f1;
      font-size: 14px;
    }

    td.label {
      font-weight: 600;
      color: #2c3e50;
    }

    td.value {
      text-align: right;
      font-family: monospace;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #7f8c8d;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .false {
      background: #eafaf1;
      color: #1e8449;
    }

    .true {
      background: #fdedec;
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>System Status</h2>

    <table>
      <tr>
        <td class="label">Kadena Contract Paused</td>
        <td class="value"><span class="badge __KADENA_PAUSED__">__KADENA_PAUSED__</span></td>
      </tr>
      <tr>
        <td class="label">Ethereum Hook Paused</td>
        <td class="value"><span class="badge __HOOK_PAUSED__">__HOOK_PAUSED__</span></td>
      </tr>
      <tr>
        <td class="label">Ethereum ISM Paused</td>
        <td class="value"><span class="badge __ISM_PAUSED__">__ISM_PAUSED__</span></td>
      </tr>
    </table>

    <div class="footer">
      Date: <span id="date"> __DATE__</span>
    </div>
  </div>


</body>
</html>
